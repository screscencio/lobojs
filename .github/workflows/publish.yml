# Publishes LoboJS to npm when a GitHub release is published.
# npm trusts this workflow through trusted publishing, so no npm token is stored here.
# The repository and this file are linked once on npmjs.com, under the package's
# Trusted publishing settings.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm publish --access public
